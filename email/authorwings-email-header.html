<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>AuthorWings &mdash; Email Header</title>

<!-- Arvo Bold = the slab monogram · PT Serif Bold = the transitional wordmark -->
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=PT+Serif:wght@700&display=swap" rel="stylesheet" type="text/css" />
<style type="text/css">
  @import url('https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=PT+Serif:wght@700&display=swap');
  body { margin:0 !important; padding:0 !important; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table { border-collapse:collapse !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
  @media only screen and (max-width:620px) {
    .aw-wrap { width:100% !important; }
    .aw-head-pad { padding-left:24px !important; padding-right:24px !important; }
  }
</style>
<!--[if mso]>
<style type="text/css">
  .aw-mark { font-family: Rockwell, Georgia, serif !important; }
  .aw-word { font-family: 'PT Serif', Georgia, 'Times New Roman', serif !important; }
</style>
<![endif]-->
</head>

<body style="margin:0; padding:0; background-color:#EFEFEF;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EFEFEF;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <!--[if mso]>
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
      <![endif]-->

      <table role="presentation" class="aw-wrap" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px; max-width:600px;">

        <!-- ============================================================
             AUTHORWINGS EMAIL HEADER
             Lockup scaled 0.375 from the 128px master (disc 128 -> 48px)
             Bar #5C776B · Disc #FFFFFF · "AW" #5C776B · Wordmark #FFFFFF
             Monogram: Arvo 700, 23px (0.48 x disc), tracking 0
             Wordmark: PT Serif 700, 24px, set solid, no tracking
             Trademark: same 24px — the glyph is drawn at cap height,
             which is why it needs no <sup> to sit on top
             ============================================================ -->
        <tr>
          <td class="aw-head-pad" align="left" bgcolor="#5C776B"
              style="background-color:#5C776B; padding:26px 34px;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <!-- "AW" monogram on the white disc -->
                <td class="aw-mark" align="center" valign="middle" width="48" height="48" bgcolor="#FFFFFF"
                    style="width:48px; height:48px; background-color:#FFFFFF;
                           border-radius:24px; -webkit-border-radius:24px; -moz-border-radius:24px;
                           text-align:center; vertical-align:middle;
                           font-family:'Arvo', 'Roboto Slab', 'Zilla Slab', Rockwell, Georgia, serif;
                           font-size:23px; font-weight:700; line-height:48px;
                           color:#5C776B; letter-spacing:0; mso-line-height-rule:exactly;">
                  AW
                </td>

                <!-- 9px optical gap (24px at master scale) -->
                <td width="9" style="width:9px; min-width:9px; font-size:1px; line-height:1px;">&#8203;</td>

                <!-- "AuthorWings" wordmark -->
                <td class="aw-word" valign="middle" style="vertical-align:middle;">
                  <span style="font-family:'PT Serif', 'Noto Serif', 'Source Serif 4', Georgia, 'Times New Roman', serif;
                               font-size:24px; font-weight:700; line-height:30px;
                               color:#FFFFFF; letter-spacing:0;
                               mso-line-height-rule:exactly; white-space:nowrap;">AuthorWings<span style="font-size:24px; line-height:30px; vertical-align:baseline;">&trade;</span></span>
                </td>
              </tr>
            </table>

          </td>
        </tr>
        <!-- ==================== END HEADER ==================== -->

      </table>

      <!--[if mso]>
      </td></tr></table>
      <![endif]-->

    </td>
  </tr>
</table>

</body>
</html>
