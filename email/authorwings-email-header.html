<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>AuthorWings &mdash; Email Header</title>
<!--[if mso]>
<style type="text/css">
  body, table, td, span { font-family: Georgia, 'Times New Roman', Times, serif !important; }
</style>
<![endif]-->
<style type="text/css">
  body { margin:0 !important; padding:0 !important; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table { border-collapse:collapse !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
  @media only screen and (max-width:620px) {
    .aw-wrap { width:100% !important; }
    .aw-head-pad { padding-left:22px !important; padding-right:22px !important; }
  }
</style>
</head>

<body style="margin:0; padding:0; background-color:#EFEFEF;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EFEFEF;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <!--[if mso]>
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
      <![endif]-->

      <table role="presentation" class="aw-wrap" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px; max-width:600px; background-color:#FFFFFF; border:1px solid #E3E3E3;">

        <!-- ============================================================
             AUTHORWINGS EMAIL HEADER  —  copy this <tr> into any email
             Green bar: #5A7264 · Badge: #4C6155 · Text: #FFFFFF
             ============================================================ -->
        <tr>
          <td class="aw-head-pad" align="left" bgcolor="#5A7264"
              style="background-color:#5A7264; padding:22px 32px;">

            <!-- LOGO — built entirely in HTML, no image file -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <!-- "AW" badge -->
                <td valign="middle" width="34" height="34" align="center" bgcolor="#4C6155"
                    style="width:34px; height:34px; background-color:#4C6155;
                           border-radius:17px; -webkit-border-radius:17px; -moz-border-radius:17px;
                           text-align:center; vertical-align:middle;
                           font-family:Georgia,'Times New Roman',Times,serif;
                           font-size:13px; font-weight:bold; line-height:34px;
                           color:#FFFFFF; letter-spacing:0.5px; mso-line-height-rule:exactly;">
                  AW
                </td>

                <!-- "AuthorWings" wordmark -->
                <td valign="middle" style="padding-left:11px; vertical-align:middle;">
                  <span style="font-family:Georgia,'Times New Roman',Times,serif; font-size:17px;
                               line-height:22px; color:#FFFFFF; letter-spacing:0.2px;
                               mso-line-height-rule:exactly; white-space:nowrap;">
                    <strong style="font-weight:bold;">Author</strong><span style="font-weight:normal;">Wings</span><sup style="font-size:8px; line-height:1;">&#174;</sup>
                  </span>
                </td>
              </tr>
            </table>

          </td>
        </tr>
        <!-- ==================== END HEADER ==================== -->

        <!-- Your email body goes here -->
        <tr>
          <td align="left" style="padding:30px 32px; font-family:Georgia,'Times New Roman',Times,serif; font-size:15px; line-height:24px; color:#2B2B2B; mso-line-height-rule:exactly;">
            <!-- content -->
          </td>
        </tr>

      </table>

      <!--[if mso]>
      </td></tr></table>
      <![endif]-->

    </td>
  </tr>
</table>

</body>
</html>
