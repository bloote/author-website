<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>AuthorWings &mdash; Email Header</title>

<!-- Slab face closest to the AuthorWings logo. Loads in browsers, Apple Mail
     and iOS Mail; Gmail/Outlook ignore it and fall back to Rockwell/Georgia. -->
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet" type="text/css" />

<!--[if mso]>
<style type="text/css">
  .aw-mark, .aw-word { font-family: Rockwell, Georgia, 'Times New Roman', serif !important; }
</style>
<![endif]-->

<style type="text/css">
  body { margin:0 !important; padding:0 !important; width:100% !important; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table { border-collapse:collapse !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
  @media only screen and (max-width:620px) {
    .aw-wrap { width:100% !important; }
    .aw-head-pad { padding-left:24px !important; padding-right:24px !important; }
  }
</style>
</head>

<body style="margin:0; padding:0; background-color:#EFEFEF;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EFEFEF;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <!--[if mso]>
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
      <![endif]-->

      <table role="presentation" class="aw-wrap" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px; max-width:600px;">

        <!-- ============================================================
             AUTHORWINGS EMAIL HEADER — logo rebuilt in pure HTML
             Bar #5A7264 · Disc #EFEDE7 · "AW" #5A7264 · Wordmark #FFFFFF
             Type: Roboto Slab / Rockwell / Georgia, weight 800
             ============================================================ -->
        <tr>
          <td class="aw-head-pad" align="left" bgcolor="#5A7264"
              style="background-color:#5A7264; padding:26px 34px;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <!-- "AW" monogram on the pale disc -->
                <td class="aw-mark" align="center" valign="middle" width="46" height="46" bgcolor="#EFEDE7"
                    style="width:46px; height:46px; background-color:#EFEDE7;
                           border-radius:23px; -webkit-border-radius:23px; -moz-border-radius:23px;
                           text-align:center; vertical-align:middle;
                           font-family:'Roboto Slab', Rockwell, Georgia, 'Times New Roman', serif;
                           font-size:23px; font-weight:800; line-height:46px;
                           color:#5A7264; letter-spacing:-0.5px; mso-line-height-rule:exactly;">
                  AW
                </td>

                <!-- "AuthorWings" wordmark -->
                <td class="aw-word" valign="middle" style="padding-left:14px; vertical-align:middle;">
                  <span style="font-family:'Roboto Slab', Rockwell, Georgia, 'Times New Roman', serif;
                               font-size:25px; font-weight:800; line-height:30px;
                               color:#FFFFFF; letter-spacing:-0.3px;
                               mso-line-height-rule:exactly; white-space:nowrap;">AuthorWings</span>
                </td>
              </tr>
            </table>

          </td>
        </tr>
        <!-- ==================== END HEADER ==================== -->

      </table>

      <!--[if mso]>
      </td></tr></table>
      <![endif]-->

    </td>
  </tr>
</table>

</body>
</html>
